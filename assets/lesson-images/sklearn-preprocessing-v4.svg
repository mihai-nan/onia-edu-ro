<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="665" viewBox="0 0 1040 665" role="img"
     aria-label="Preprocesarea: TRAIN versus TEST">
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8"
                orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10Z" fill="#6487ac"/>
        </marker>
    </defs>
    <style>.ttl{font:700 26px Arial,sans-serif;fill:#173c6a}.sub{font:400 15px
        Arial,sans-serif;fill:#536e8e}.lane{font:700 15px
        Arial,sans-serif;fill:#275f9e;letter-spacing:.02em}.main{font:700 19px
        Arial,sans-serif;fill:#1c456f}.minor{font:400 15px Arial,sans-serif;fill:#4b6482}.foot{font:600 14px
        Arial,sans-serif;fill:#4c6683}
    </style>
    <rect x="3" y="3" width="1034" height="659" rx="20" fill="#fcfdff" stroke="#d5e6f5" stroke-width="2"/>
    <text x="32" y="43" class="ttl">Preprocesarea: TRAIN versus TEST</text>
    <text x="32" y="72" class="sub">Aceeași transformare, două faze distincte: învățare și aplicare.</text>
    <text x="55" y="127" class="lane">1 · TRAIN: ÎNVĂȚĂM REGULA</text>
    <rect x="56" y="143" rx="14" width="268" height="102" fill="#edf4ff" stroke="#b8d4f1" stroke-width="2"/>
    <text x="190.0" y="177" class="main" text-anchor="middle">Date brute TRAIN</text>
    <text x="190.0" y="205" class="minor" text-anchor="middle">de exemplu [2, 4, 6]</text>
    <path d="M328 194.0 H366" fill="none" stroke="#6487ac" stroke-width="3.3" marker-end="url(#arrow)"/>
    <rect x="382" y="143" rx="14" width="268" height="102" fill="#edf4ff" stroke="#b8d4f1" stroke-width="2"/>
    <text x="516.0" y="177" class="main" text-anchor="middle">fit(transformator)</text>
    <text x="516.0" y="205" class="minor" text-anchor="middle">media și abaterea din train</text>
    <text x="516.0" y="229" class="minor" text-anchor="middle">μ = 4; σ ≈ 1,633</text>
    <path d="M654 194.0 H692" fill="none" stroke="#6487ac" stroke-width="3.3" marker-end="url(#arrow)"/>
    <rect x="708" y="143" rx="14" width="268" height="102" fill="#edf4ff" stroke="#b8d4f1" stroke-width="2"/>
    <text x="842.0" y="177" class="main" text-anchor="middle">transform(TRAIN)</text>
    <text x="842.0" y="205" class="minor" text-anchor="middle">aplicăm regula învățată</text>
    <text x="842.0" y="229" class="minor" text-anchor="middle">[−1,225; 0; 1,225]</text>
    <line x1="54" y1="279" x2="986" y2="279" stroke="#e4edf7" stroke-dasharray="4 7"/>
    <text x="55" y="303" class="lane">2 · TEST: FOLOSIM REGULA</text>
    <rect x="56" y="319" rx="14" width="268" height="102" fill="#e8f4fc" stroke="#abd7e0" stroke-width="2"/>
    <text x="190.0" y="353" class="main" text-anchor="middle">Date brute TEST</text>
    <text x="190.0" y="381" class="minor" text-anchor="middle">de exemplu x = 3</text>
    <path d="M328 370.0 H366" fill="none" stroke="#6487ac" stroke-width="3.3" marker-end="url(#arrow)"/>
    <rect x="382" y="319" rx="14" width="268" height="102" fill="#e8f4fc" stroke="#abd7e0" stroke-width="2"/>
    <text x="516.0" y="353" class="main" text-anchor="middle">transform(TEST)</text>
    <text x="516.0" y="381" class="minor" text-anchor="middle">aceeași μ și aceeași σ</text>
    <text x="516.0" y="405" class="minor" text-anchor="middle">fără recalculare</text>
    <path d="M654 370.0 H692" fill="none" stroke="#6487ac" stroke-width="3.3" marker-end="url(#arrow)"/>
    <rect x="708" y="319" rx="14" width="268" height="102" fill="#e8f4fc" stroke="#abd7e0" stroke-width="2"/>
    <text x="842.0" y="353" class="main" text-anchor="middle">Rezultat TEST</text>
    <text x="842.0" y="381" class="minor" text-anchor="middle">z = (3 − 4) / 1,633</text>
    <text x="842.0" y="405" class="minor" text-anchor="middle">aproximativ −0,612</text>
    <line x1="54" y1="455" x2="986" y2="455" stroke="#e4edf7" stroke-dasharray="4 7"/>
    <text x="55" y="479" class="lane">3 · MODEL: FOLOSIM REZULTATUL</text>
    <rect x="56" y="495" rx="14" width="268" height="102" fill="#fdf3e6" stroke="#e8c48a" stroke-width="2"/>
    <text x="190.0" y="529" class="main" text-anchor="middle">TRAIN transformat</text>
    <text x="190.0" y="557" class="minor" text-anchor="middle">fit(model, y_train)</text>
    <path d="M328 546.0 H366" fill="none" stroke="#6487ac" stroke-width="3.3" marker-end="url(#arrow)"/>
    <rect x="382" y="495" rx="14" width="268" height="102" fill="#fdf3e6" stroke="#e8c48a" stroke-width="2"/>
    <text x="516.0" y="529" class="main" text-anchor="middle">TEST transformat</text>
    <text x="516.0" y="557" class="minor" text-anchor="middle">predict(model, X_test)</text>
    <path d="M654 546.0 H692" fill="none" stroke="#6487ac" stroke-width="3.3" marker-end="url(#arrow)"/>
    <rect x="708" y="495" rx="14" width="268" height="102" fill="#fdf3e6" stroke="#e8c48a" stroke-width="2"/>
    <text x="842.0" y="529" class="main" text-anchor="middle">Predicții</text>
    <text x="842.0" y="557" class="minor" text-anchor="middle">evaluare, dacă avem y_test</text>
    <text x="842.0" y="581" class="minor" text-anchor="middle">fără antrenare pe test</text>
    <text x="40" y="630" class="foot">fit_transform(TRAIN) = fit + transform; pentru TEST executăm doar transform.
    </text>
</svg>