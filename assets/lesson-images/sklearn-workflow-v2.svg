<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img">
    <defs>
        <marker id="arrA" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
            <path d="M0,0 L8,4 L0,8" fill="#6a86aa"/>
        </marker>
        <style>
            .ttl{font:700 34px Arial,sans-serif;fill:#163e70}.sub{font:600 17px Arial,sans-serif;fill:#5d7591}
            .box{font:700 20px Arial,sans-serif;fill:#183b68}.small{font:500 15px Arial,sans-serif;fill:#4c6683}
            .tag{font:700 15px Arial,sans-serif;fill:#225e9d}.note{font:700 15px Arial,sans-serif;fill:#546e89}
            .ln{stroke:#6a86aa;stroke-width:4;fill:none;marker-end:url(#arrA)}
        </style>
    </defs>
    <rect x="12" y="12" width="1256" height="396" rx="22" fill="#fbfdff" stroke="#d7e6f5" stroke-width="2"/>
    <text x="42" y="54" class="ttl">Protocol corect: dezvoltare, selecție și test final</text>
    <text x="42" y="82" class="sub">Figura 1. Imaginea de ansamblu: „procesare” este generică și poate include
        preprocesare, selecția caracteristicilor și modelul.
    </text>
    <rect x="55" y="155" width="190" height="92" rx="16" fill="#eef5ff" stroke="#c4d9f0" stroke-width="2"/>
    <text x="150" y="190" text-anchor="middle" class="box">Date etichetate</text>
    <text x="150" y="220" text-anchor="middle" class="small">X și y</text>
    <rect x="315" y="155" width="205" height="92" rx="16" fill="#eef5ff" stroke="#c4d9f0" stroke-width="2"/>
    <text x="417" y="190" text-anchor="middle" class="box">Separare inițială</text>
    <text x="417" y="220" text-anchor="middle" class="small">înainte de orice fit</text>
    <path d="M245 201 H305" class="ln"/>
    <path d="M520 201 H578" class="ln"/>
    <path d="M578 201 V130 H640" class="ln"/>
    <path d="M578 201 V272 H640" class="ln"/>
    <rect x="640" y="95" width="270" height="106" rx="18" fill="#eef5ff" stroke="#a9c7ea" stroke-width="2.4"/>
    <text x="775" y="139" text-anchor="middle" class="box">Date de dezvoltare</text>
    <text x="775" y="171" text-anchor="middle" class="small">train + eventual validare / CV</text>
    <text x="775" y="195" text-anchor="middle" class="tag">aici alegem modelul și hiperparametrii</text>
    <rect x="962" y="95" width="248" height="106" rx="18" fill="#e5f6f2" stroke="#94d4c6" stroke-width="2.4"/>
    <text x="1086" y="139" text-anchor="middle" class="box">Procesare + model</text>
    <text x="1086" y="171" text-anchor="middle" class="small">fit doar pe datele de dezvoltare</text>
    <text x="1086" y="195" text-anchor="middle" class="tag">transformări + antrenare</text>
    <path d="M910 148 H952" class="ln"/>
    <rect x="640" y="258" width="270" height="106" rx="18" fill="#fff7ec" stroke="#efc37f" stroke-width="2.4"/>
    <text x="775" y="304" text-anchor="middle" class="box">Test final</text>
    <text x="775" y="334" text-anchor="middle" class="small">rezervat evaluării finale</text>
    <path d="M910 310 H1010 V234 H1230" class="ln"/>
    <path d="M1210 148 H1230" class="ln"/>
    <rect x="1230" y="160" width="-1" height="0" fill="none"/>
    <rect x="1240" y="158" width="0" height="0" fill="none"/>
    <rect x="1218" y="157" width="0" height="0" fill="none"/>
    <rect x="1230" y="158" width="0" height="0" fill="none"/>
    <rect x="1216" y="155" width="0" height="0" fill="none"/>
    <rect x="1226" y="156" width="0" height="0" fill="none"/>
    <rect x="1215" y="155" width="0" height="0" fill="none"/>
    <rect x="1218" y="156" width="0" height="0" fill="none"/>
    <rect x="1210" y="145" width="0" height="0" fill="none"/>
    <rect x="1218" y="145" width="0" height="0" fill="none"/>
    <rect x="1210" y="145" width="0" height="0" fill="none"/>
    <rect x="1205" y="156" width="160" height="88" rx="16" fill="#eef5ff" stroke="#c4d9f0" stroke-width="2"
          transform="translate(-10,0)"/>
    <text x="1275" y="191" text-anchor="middle" class="box">Predicții</text>
    <text x="1275" y="221" text-anchor="middle" class="small">și scoruri</text>
    <text x="545" y="240" class="note">Pe testul final nu alegem modelul și nu recalculăm statistici.</text>
    <text x="42" y="380" class="tag">Mesaj-cheie:</text>
    <text x="165" y="380" class="note">orice decizie repetată pe baza testului final transformă testul într-un
        pseudo-set de validare.
    </text>
</svg>