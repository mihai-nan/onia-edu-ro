<style>
:root{--blue:#174a7a;--blue2:#256cb0;--light:#eef6ff;--line:#d9e5f2;--muted:#627792;--ink:#233b56;--green:#14765c;--red:#ac3e49}*{box-sizing:border-box}body{margin:0;background:#f3f7fc;color:var(--ink);font:15px/1.55 system-ui,-apple-system,Segoe UI,Arial,sans-serif}.shell{max-width:1190px;margin:0 auto;padding:22px 20px 42px}.hero{padding:27px 30px;border-radius:20px;background:linear-gradient(120deg,#102b56,#176a9b);color:#fff;position:relative;overflow:hidden}.hero:after{content:'RO · AI';position:absolute;right:-2%;top:-20%;font-size:145px;font-weight:900;color:#fff;opacity:.04}.eyebrow{font-size:11px;letter-spacing:.15em;font-weight:850;color:#aadbf6}.hero h1{font-size:clamp(23px,3vw,32px);margin:5px 0 8px}.hero p{max-width:800px;margin:0;color:#e2f1fd}.tricolor{height:5px;background:linear-gradient(90deg,#174dac 33.333%,#ffcf26 33.333% 66.666%,#dd343f 66.666%);margin-bottom:8px;border-radius:4px}.tabs{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.tabs button{appearance:none;border:1px solid #d4e3f0;background:#fff;color:#36536f;border-radius:10px;padding:10px 15px;font-weight:760;cursor:pointer}.tabs button[aria-selected=true]{background:#1d5d9e;color:#fff;border-color:#1d5d9e}.layout{display:grid;grid-template-columns:minmax(270px,340px) minmax(0,1fr);gap:16px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:21px;min-width:0}.panel h2{font-size:21px;color:#173d66;margin:0 0 12px}.panel h3{font-size:16px;color:#1e5182;margin:16px 0 7px}.field{margin:15px 0}.field label{display:block;font-weight:750;margin-bottom:6px;color:#345577}.field textarea,.field input,.field select{width:100%;background:#f8fbff;border:1px solid #bdcfdf;border-radius:9px;padding:10px;color:#1e3955;font:inherit}.field textarea{min-height:120px;resize:vertical}.field small{display:block;color:var(--muted);margin-top:6px}.check{display:flex;align-items:center;gap:9px;margin:11px 0;cursor:pointer}.check input{width:18px;height:18px;accent-color:var(--blue2)}.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.btn{border-radius:9px;padding:9px 12px;font-weight:780;border:1px solid #b5d0e9;background:#f1f7ff;color:#215c92;cursor:pointer}.btn:hover{background:#e0efff}.note{padding:13px 15px;background:#edf5ff;border-left:4px solid #2f78c5;border-radius:9px;margin:14px 0;color:#315879}.warn{background:#fff6ed;border-color:#d89139;color:#79501f}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:14px 0}.metric{background:#f4f9ff;border:1px solid #dce8f4;border-radius:13px;padding:11px}.metric strong{display:block;color:#1764a5;font-size:24px}.metric span{color:#5b738d;font-size:12px}.tokens{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.tok{padding:5px 9px;border-radius:8px;background:#e9f3ff;border:1px solid #cbdff2;font-weight:650;color:#255c91}.tok.remove{background:#fff0ef;color:#9d3841;text-decoration:line-through;border-color:#f1c9c9}.tok.safe{background:#e8f7ef;color:#206b51;border-color:#b7dec7}.trace{border-left:2px solid #bbd3e9;margin-left:12px;padding-left:17px}.tracebox{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin:12px 0}.tracebox b{color:#185a94}.scroll{overflow:auto}.table{border-collapse:collapse;width:100%;font-size:13px;margin:14px 0}.table th,.table td{border-bottom:1px solid #e0e8f2;text-align:left;padding:10px;vertical-align:top}.table th{background:#eef5ff;color:#225b8e}.small{font-size:13px;color:#627792}.bar{display:inline-block;height:11px;background:#73a6d5;border-radius:5px;min-width:4px}.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.card{border:1px solid var(--line);border-radius:13px;padding:14px;background:#fafcff}.card h3{margin-top:0}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #88c3f5;outline-offset:2px}.footer{font-size:12px;color:#637891;margin:18px 0}@media(max-width:820px){.layout{grid-template-columns:1fr}.shell{padding:12px}.panel{padding:15px}.hero{padding:21px}.cols{grid-template-columns:1fr}}
</style>
<style id="onia-return-style">.onia-back-bar{position:relative;z-index:1000;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:#fff;color:#18345b;border:1px solid #d6e5f5;border-radius:13px;margin:12px auto;padding:10px 15px;max-width:1180px;box-shadow:0 3px 15px #1539650b;font:600 14px/1.4 system-ui,sans-serif}.onia-back-bar a{color:#17569e;text-decoration:none;font-weight:700}.onia-back-bar a:first-child{background:#eef5ff;border-radius:9px;padding:9px 12px}.onia-back-bar a:hover{background:#dcecff}.onia-back-bar .onia-back-title{font-weight:600;color:#5b7391;font-size:13px}@media(max-width:600px){.onia-back-bar{margin:8px;padding:8px}.onia-back-title{display:none}}</style></head>
<body><div class="onia-back-bar"><a href="../index.html#/nlp/nlp-morfologie" aria-label="Înapoi la lecție">← Înapoi la lecție</a><span class="onia-back-title">Stopwords, stemming și lematizare</span><a href="../cursuri.html">Cursuri recomandate</a></div><main class="shell"><div class="tricolor"></div><header class="hero"><div class="eyebrow">ONIA · LABORATOR NLP · 5.5</div><h1>Stopwords, stemming și lematizare</h1><pNone>Modifică datele și urmărește fiecare transformare.</p></header><nav class="tabs" aria-label="Experimente"><button data-tab="filtru" aria-selected="true">1. Stopwords și negații</button><button data-tab="morfologie" aria-selected="false">2. Stemming vs. leme</button><button data-tab="df" aria-selected="false">3. TF / DF și max_df</button><button data-tab="alegere" aria-selected="false">4. Alegerea strategiei</button></nav><section class="layout"><aside class="panel" id="controls"></aside><article class="panel" id="results" aria-live="polite"></article></section><p class="footer">ONIA · Resurse educaționale — Date și explicații didactice.</p></main>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id), esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
const state={tab:'filtru',text:'Nu este bun produsul. Este bun produsul.',stop:'este, și, la, produsul, nu',protect:true,docText:'sport tenis meci\nsport fotbal stadion\nsport înot bazin\nsport tenis turneu',maxDf:0.75,chosen:'sentiment'};
const textTokens=s=>(s.toLocaleLowerCase('ro').match(/[\p{L}\p{N}]+/gu)||[]);
function tokenBoxes(original,stop,protect){return original.map(t=>{const filtered=stop.has(t)&&!(protect&&['nu','nici','fără'].includes(t));return `<span class="tok ${filtered?'remove':(['nu','nici','fără'].includes(t)?'safe':'')}">${esc(t)}</span>`;}).join('')}
function tokenText(toks){return `<div class="tokens">${toks.map(t=>`<span class="tok">${esc(t)}</span>`).join('')||'<i>Niciun token</i>'}</div>`}
function field(label,id,v,kind='text',extra=''){return `<div class="field"><label for="${id}">${label}</label>${kind==='textarea'?`<textarea id="${id}" data-field="${id}">${esc(v)}</textarea>`:`<input id="${id}" data-field="${id}" type="${kind}" value="${esc(v)}" ${extra}>`}</div>`}
const table=(headers,rows)=>`<div class="scroll"><table class="table"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const metric=(a,b)=>`<div class="metric"><strong>${a}</strong><span>${b}</span></div>`;
const steps=(items)=>`<div class="trace">${items.map((x,i)=>`<div class="tracebox"><b>Pasul ${i+1}. ${x[0]}</b><div>${x[1]}</div></div>`).join('')}</div>`;
function render(){
 [...document.querySelectorAll('[data-tab]')].forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===state.tab)));
 let left='',right='';
 if(state.tab==='filtru'){
 left='<h2>Construiește un filtru</h2><p class="small">Editează textul și lista de stopwords. Bifează protejarea negațiilor.</p>'+field('Text de analizat','text',state.text,'textarea')+field('Stopwords (separate prin virgulă)','stop',state.stop,'textarea')+`<label class="check"><input type="checkbox" data-field="protect" ${state.protect?'checked':''}>Protejează „nu”, „nici”, „fără”</label><div class="btnrow"><button class="btn" data-preset="neg">Propoziții cu negație</button><button class="btn" data-preset="span">Texte cu forme flexionare</button></div>`;
 const tokens=textTokens(state.text),stop=new Set(state.stop.split(',').map(x=>x.trim().toLocaleLowerCase('ro')).filter(Boolean)),kept=tokens.filter(t=>!stop.has(t)||(state.protect&&['nu','nici','fără'].includes(t)));const dropped=tokens.filter(t=>!kept.includes(t));
 const s1=['Nu este bun','Este bun'].map(t=>textTokens(t));const clean=t=>t.filter(x=>!stop.has(x)||(state.protect&&['nu','nici','fără'].includes(x))).join(' ');const a=clean(s1[0]),b=clean(s1[1]);
 right='<h2>Ce se întâmplă cu textul?</h2><div class="metrics">'+metric(tokens.length,'Tokeni inițiali')+metric(kept.length,'Tokeni păstrați')+metric(tokens.length-kept.length,'Tokeni eliminați')+'</div>'+steps([['Tokenizare',tokenText(tokens)],['Selectăm termenii din lista de eliminare',`<div class="tokens">${tokenBoxes(tokens,stop,state.protect)}</div>`],['Textul rezultat',tokenText(kept)]])+`<h3>Testul negației: două mesaje opuse</h3>${table(['Mesaj','După filtrare'],[['Nu este bun',esc(a)||'∅'],['Este bun',esc(b)||'∅']])}<div class="note ${a===b?'warn':''}">${a===b?'Atenție: reprezentările sunt identice. Un model BoW nu va distinge cele două mesaje.':'Negația a rămas în reprezentare, deci există cel puțin un semnal lexical care diferențiază mesajele.'}</div>`;
 }else if(state.tab==='morfologie'){
 left='<h2>Comparație lexicală</h2><pNone>Acest experiment arată un vocabular didactic cu rezultate Snowball calculate în Python și leme ilustrative.</p>'+field('Cuvinte, separate prin spații','text',state.text,'textarea')+'<div class="btnrow"><button class="btn" data-preset="morf">Exemplu în română</button><button class="btn" data-preset="verb">Exemplu cu verbe</button></div><div class="note">Snowball pentru română se rulează în Python cu <code>SnowballStemmer("romanian")</code>. Lemele reale pot diferi în funcție de context și de model.</div>';
 const stems={'copil':'copil','copilului':'copil','copiii':'copii','cărțile':'cărț','cărților':'cărț','elev':'elev','elevii':'elev','elevului':'elev','mergeam':'merg','mergeau':'merg','frumoase':'frumoas','citesc':'citesc','citit':'citit','citirea':'citir','problemele':'problem','problemelor':'problem','nu':'nu','este':'este','bun':'bun','recomand':'recomand','recomandat':'recomand'};
 const lemmas={'copil':'copil','copilului':'copil','copiii':'copil','cărțile':'carte','cărților':'carte','elev':'elev','elevii':'elev','elevului':'elev','mergeam':'merge','mergeau':'merge','frumoase':'frumos','citesc':'citi','citit':'citi','citirea':'citire','problemele':'problemă','problemelor':'problemă','nu':'nu','este':'fi','bun':'bun','recomand':'recomanda','recomandat':'recomanda'};
 const words=textTokens(state.text),rows=words.map(w=>[esc(w),stems[w]?esc(stems[w]):'<span class="small">Nedisponibil pentru acest cuvânt</span>',lemmas[w]?esc(lemmas[w]):'<span class="small">Nedisponibil</span>']);
 right='<h2>Urmărește transformările</h2>'+table(['Formă în text','Stem Snowball cunoscut','Lemă posibilă (ilustrativ)'],rows)+`<div class="note">Comparația este limitată la vocabularul demonstrativ. „Lemă posibilă” reprezintă o corespondență explicativă, nu predicția curentă a unui model spaCy sau Stanza.</div>`+steps([['Identificăm forma originală','Păstrăm tokenii textului.'],['Stemming','Aplicăm o reducere algoritmică de tip Snowball.'],['Lematizare','Un model real folosește contextul și POS pentru forma de dicționar.']]);
 }else if(state.tab==='df'){
 left='<h2>Frecvența în corpus</h2>'+field('Un document pe fiecare rând','docText',state.docText,'textarea')+`<div class="field"><label for="maxDf">max_df: ${state.maxDf.toFixed(2)}</label><input id="maxDf" data-field="maxDf" type="range" min="0.25" max="1" step="0.05" value="${state.maxDf}"><small>Termenii care apar în mai mult de max_df × N documente sunt eliminați.</small></div>`;
 const docs=state.docText.split('\n').map(x=>x.trim()).filter(Boolean),tf={},df={},byDoc=docs.map(textTokens);byDoc.forEach(tokens=>{tokens.forEach(t=>tf[t]=(tf[t]||0)+1);new Set(tokens).forEach(t=>df[t]=(df[t]||0)+1)});const rows=Object.keys(df).sort((a,b)=>df[b]-df[a]||a.localeCompare(b)).map(t=>[esc(t),String(tf[t]),`${df[t]} / ${docs.length}`,`<span class="bar" style="width:${Math.round(df[t]/docs.length*110)}px"></span>`,df[t]/docs.length>state.maxDf?'<b style="color:var(--red)">Exclus</b>':'<b style="color:var(--green)">Păstrat</b>']);
 right='<h2>TF vs. DF</h2><div class="metrics">'+metric(docs.length,'Documente')+metric(Object.keys(df).length,'Termeni diferiți')+metric(rows.filter(x=>x[4].includes('Păstrat')).length,'Termeni păstrați')+'</div>'+table(['Termen','TF total','DF','Proporție DF','max_df'],rows)+`<div class="note">Regula este <b>strict mai mult</b> decât pragul: un termen cu DF/N = max_df este păstrat. În sklearn, valorile fracționare sunt raportate la numărul documentelor din train.</div>`;
 } else {
 left=`<h2>Alege o strategie</h2><div class="field"><label for="chosen">Tipul problemei</label><select id="chosen" data-field="chosen"><option value="sentiment" ${state.chosen==='sentiment'?'selected':''}>Sentiment — mesaje scurte</option><option value="stiri" ${state.chosen==='stiri'?'selected':''}>Clasificarea știrilor</option><option value="tehnic" ${state.chosen==='tehnic'?'selected':''}>Coduri și mesaje tehnice</option><option value="typo" ${state.chosen==='typo'?'selected':''}>Texte cu greșeli de scriere</option></select></div><p class="small">Recomandările sunt ipoteze de verificat, nu rezultate numerice.</p>`;
 const data={sentiment:['Fără eliminarea negațiilor','TF-IDF cu unigrame și bigrame','macro-F1 și erori pe negații','Eliminarea lui „nu” poate inversa sensul.'],stiri:['TF-IDF clasic, apoi comparație cu stemming','Unigrame și posibil max_df pentru termenii universali','macro-F1 pe categorii','Cuvintele-cheie din domenii pot fi foarte informative.'],tehnic:['Păstrează cifrele și structura codurilor','Regex pentru marcaje, n-grame de caractere','F1 pentru clasa rară','Ștergerea cifrelor poate distruge codurile de produs.'],typo:['N-grame de caractere','TfidfVectorizer(analyzer="char_wb",ngram_range=(3,5))','macro-F1 și erori pe variante scrise greșit','Stemmingul nu corectează automat ortografia.']}[state.chosen];
 right='<h2>Plan de experiment recomandat</h2>'+table(['Componentă','Recomandare'],[['Strategie inițială',data[0]],['Reprezentare',esc(data[1])],['Metrică',esc(data[2])],['Risc de urmărit',esc(data[3])]])+steps([['Construiește un baseline','Fără preprocesare agresivă și fără folosirea testului final.'],['Modifică un singur parametru','Compară stopwords, stemming sau lematizare pe aceleași folduri.'],['Compară și interpretează','Urmărește macro-F1, dimensiunea vocabularului și exemplele clasificate greșit.'],['Păstrează configurația justificată','Reantrenează numai pe datele permise și exportă predicțiile.']]);
 }
 $('controls').innerHTML=left;$('results').innerHTML=right;
}
document.addEventListener('click',e=>{const tab=e.target.closest('[data-tab]');if(tab){state.tab=tab.dataset.tab;render();return;}const preset=e.target.closest('[data-preset]');if(!preset)return;const presets={neg:['Nu este bun produsul. Este bun produsul.','este, și, la, produsul, nu'],span:['Elevii citesc cărțile, iar elevul citește manualul.','și, la, iar'],morf:['copil copilului copiii cărțile cărților elev elevii elevului'],verb:['mergeam mergeau recomand recomandat problemele problemelor']};const p=presets[preset.dataset.preset];if(p){state.text=p[0];if(p[1])state.stop=p[1];render();}});
document.addEventListener('change',e=>{const id=e.target.dataset.field;if(!id)return;state[id]=e.target.type==='checkbox'?e.target.checked:e.target.type==='range'?+e.target.value:e.target.value;render()});
document.addEventListener('input',e=>{const id=e.target.dataset.field;if(!id||e.target.type!=='range')return;state[id]=+e.target.value;render()});render();
})();
</script></body></html>
